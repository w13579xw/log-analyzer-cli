[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "log-analyzer"
version = "0.1.0"
description = "A small CLI for filtering and summarizing server logs."
readme = "README.md"
requires-python = ">=3.9"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
loganalyzer = "loganalyzer.cli:main"

[tool.setuptools.packages.find]
include = ["loganalyzer*"]
